server.port=8081

# ==================== 数据源：本地 MySQL ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springboottest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ==================== MyBatis-Plus ====================
# 下划线自动转驼峰：create_time -> createTime
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL，便于调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键自增
mybatis-plus.global-config.db-config.id-type=auto
