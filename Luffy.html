<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航海王 · 船员招募登记</title>
<style>
  :root{
    --deep:#04203f;
    --sea:#0a3d6b;
    --sea2:#12629b;
    --gold:#f2c14e;
    --gold-dark:#b8860b;
    --parchment:#f7e9cd;
    --ink:#2a1c0e;
    --red:#c0392b;
    --ok:#2e9e5b;
    --shadow:0 24px 60px rgba(2,14,30,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:linear-gradient(180deg,#0a2a4d 0%,#0a3d6b 45%,#052341 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- 背景：海面与波浪 ---------- */
  .scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .sun{
    position:absolute;top:-120px;left:50%;transform:translateX(-50%);
    width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,120,.35),rgba(255,214,120,0) 65%);
    animation:sunPulse 7s ease-in-out infinite;
  }
  @keyframes sunPulse{0%,100%{opacity:.75;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
  .cloud{
    position:absolute;background:rgba(255,255,255,.10);border-radius:100px;
    filter:blur(2px);animation:drift linear infinite;
  }
  @keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(105vw)}}
  .wave{position:absolute;left:-10%;width:240%;bottom:0;opacity:.55}
  .wave svg{width:100%;height:auto;display:block}
  .w1{bottom:-10px;animation:sway 13s ease-in-out infinite;opacity:.45}
  .w2{bottom:-30px;animation:sway 9s ease-in-out infinite reverse;opacity:.3}
  .w3{bottom:-50px;animation:sway 17s ease-in-out infinite;opacity:.22}
  @keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-6%)}}
  .gull{position:absolute;top:16%;font-size:22px;opacity:.5;animation:fly linear infinite}
  @keyframes fly{from{transform:translateX(-10vw) translateY(0)}to{transform:translateX(110vw) translateY(-40px)}}

  /* ---------- 主体 ---------- */
  .stage{
    position:relative;z-index:2;
    width:100%;max-width:960px;
    display:grid;grid-template-columns:1fr 1fr;gap:0;
    border-radius:22px;overflow:hidden;
    box-shadow:var(--shadow);
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(6px);
    border:1px solid rgba(242,193,78,.28);
  }

  /* 左：招募令 */
  .brand{
    position:relative;
    background:
      radial-gradient(circle at 30% 20%,rgba(242,193,78,.18),transparent 60%),
      linear-gradient(160deg,#06294c,#0b3f6f 60%,#052341);
    padding:44px 38px;color:#f7e9cd;display:flex;flex-direction:column;gap:18px;
    overflow:hidden;
  }
  .brand::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 8px);
    pointer-events:none;
  }
  .wheel{width:110px;height:110px;animation:spin 26s linear infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand h1{font-size:30px;letter-spacing:3px;line-height:1.35;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .brand h1 small{display:block;font-size:14px;letter-spacing:6px;color:#cfe3f5;margin-bottom:8px;font-weight:400}
  .wanted{
    border:2px dashed rgba(242,193,78,.5);border-radius:12px;padding:14px 16px;
    font-size:13px;line-height:1.9;color:#dbe8f6;background:rgba(0,0,0,.18);
  }
  .wanted b{color:var(--gold)}
  .quote{margin-top:auto;font-size:13px;color:#9fc0dd;font-style:italic;line-height:1.8}

  /* 右：表单 */
  .card{background:linear-gradient(180deg,#fdf5e6,#f3e3c3);padding:40px 38px}
  .card h2{font-size:24px;color:var(--ink);margin-bottom:6px}
  .card .sub{font-size:13px;color:#8a6d4b;margin-bottom:26px}

  .field{position:relative;margin-bottom:22px}
  .field input{
    width:100%;height:52px;padding:18px 44px 4px 14px;
    font-size:15px;color:var(--ink);
    background:#fffaf0;border:2px solid #e2cfa8;border-radius:10px;
    outline:none;transition:border-color .25s,box-shadow .25s,background .25s;
  }
  .field input:focus{border-color:var(--gold-dark);background:#fff;box-shadow:0 0 0 4px rgba(242,193,78,.25)}
  .field label{
    position:absolute;left:15px;top:16px;font-size:15px;color:#a08a68;
    pointer-events:none;transition:all .22s ease;background:transparent;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    top:6px;font-size:11px;color:var(--gold-dark);letter-spacing:1px;
  }
  .field .icon{position:absolute;right:14px;top:16px;font-size:17px;color:#b39a72;cursor:pointer;user-select:none}
  .field .err{display:none;font-size:12px;color:var(--red);margin-top:6px}
  .field.invalid input{border-color:var(--red);background:#fff5f4}
  .field.invalid .err{display:block;animation:shakeIn .35s}
  @keyframes shakeIn{0%{transform:translateX(-5px)}25%{transform:translateX(5px)}50%{transform:translateX(-3px)}100%{transform:translateX(0)}}

  /* 密码强度 */
  .strength{display:flex;gap:6px;margin:-12px 0 20px}
  .strength i{flex:1;height:5px;border-radius:3px;background:#e2cfa8;transition:background .35s,transform .35s}
  .strength i.on{transform:scaleY(1.6)}
  .tip{font-size:12px;color:#8a6d4b;margin:-14px 0 20px;min-height:16px}

  .agree{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:#6b543a;margin-bottom:24px;line-height:1.6}
  .agree input{width:17px;height:17px;margin-top:2px;accent-color:var(--gold-dark);cursor:pointer}
  .agree a{color:var(--gold-dark)}

  /* ---------- 注册按钮 ---------- */
  .btn{
    position:relative;width:100%;height:56px;border:none;border-radius:12px;cursor:pointer;
    font-size:17px;font-weight:700;letter-spacing:2px;color:#3a2504;overflow:hidden;
    background:linear-gradient(135deg,#ffd977,#f2c14e 45%,#d99b1f);
    box-shadow:0 8px 20px rgba(184,134,11,.35),inset 0 -3px 0 rgba(0,0,0,.15);
    transition:transform .18s,box-shadow .18s,filter .3s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(184,134,11,.45),inset 0 -3px 0 rgba(0,0,0,.15)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn::before{ /* 扫光 */
    content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
    transform:skewX(-20deg);animation:sheen 2.8s ease-in-out infinite;
  }
  @keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
  .btn .txt{position:relative;z-index:2;display:inline-flex;align-items:center;gap:10px;transition:opacity .2s}
  .btn .spinner{display:none;width:20px;height:20px;animation:spin 1s linear infinite}
  .btn .check{display:none;width:22px;height:22px}
  .btn .check path{stroke-dasharray:32;stroke-dashoffset:32}

  .btn.loading{background:linear-gradient(135deg,#5b7fa6,#2f5b86);color:#fff;box-shadow:0 8px 20px rgba(20,60,100,.4);pointer-events:none}
  .btn.loading .spinner{display:inline-block}
  .btn.loading::before{display:none}
  .btn.success{background:linear-gradient(135deg,#4fc07a,#279a55);color:#fff;box-shadow:0 8px 24px rgba(39,154,85,.45);pointer-events:none}
  .btn.success .spinner{display:none}
  .btn.success .check{display:inline-block}
  .btn.success .check path{animation:draw .5s .05s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .btn.success::before{display:none}

  /* 点击涟漪 */
  .ripple{
    position:absolute;border-radius:50%;transform:scale(0);
    background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);
    animation:ripple .7s ease-out forwards;pointer-events:none;z-index:1;
  }
  @keyframes ripple{to{transform:scale(2.6);opacity:0}}

  /* 卡片震动（提交中） */
  .card.shake{animation:cardShake .5s}
  @keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  .foot{text-align:center;margin-top:18px;font-size:13px;color:#8a6d4b}
  .foot a{color:var(--gold-dark);text-decoration:none;font-weight:600}
  .foot a:hover{text-decoration:underline}

  /* ---------- 成功弹层 ---------- */
  .mask{
    position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(4,22,42,.72);backdrop-filter:blur(4px);
  }
  .mask.show{display:flex;animation:fade .35s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .flag{
    width:280px;background:linear-gradient(180deg,#fdf5e6,#f0dfba);
    border:1px solid rgba(242,193,78,.6);border-radius:16px;padding:32px 28px;text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,.5);animation:rise .7s cubic-bezier(.2,1.3,.4,1) forwards;
  }
  @keyframes rise{from{transform:translateY(80px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .flag .post{height:6px;width:70%;margin:0 auto 18px;border-radius:3px;background:linear-gradient(90deg,#8a6d4b,#d8bd8b,#8a6d4b)}
  .flag h3{font-size:22px;color:var(--ink);margin-bottom:8px}
  .flag p{font-size:14px;color:#7a6042;line-height:1.8;margin-bottom:20px}
  .flag .who{color:var(--red);font-weight:700}
  .flag button{
    border:none;border-radius:10px;padding:12px 30px;font-size:15px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,#ffd977,#e2a92c);color:#3a2504;
    box-shadow:0 8px 18px rgba(184,134,11,.35);transition:transform .18s;
  }
  .flag button:hover{transform:translateY(-2px)}

  /* 庆祝粒子 */
  .confetti{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden;display:none}
  .confetti.on{display:block}
  .p{position:absolute;top:-30px;will-change:transform}
  .p.rect{width:9px;height:16px;border-radius:2px}
  .p.coin{
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6c2,#d9a326);
    box-shadow:inset 0 0 0 2px rgba(160,110,10,.5);
  }
  @keyframes fall{
    0%{transform:translateY(-10vh) rotate(0);opacity:0}
    10%{opacity:1}
    100%{transform:translateY(105vh) rotate(720deg);opacity:.9}
  }

  @media (max-width:820px){
    .stage{grid-template-columns:1fr;max-width:460px}
    .brand{padding:30px 26px}
    .brand .quote{margin-top:20px}
    .card{padding:30px 24px}
  }
</style>
</head>
<body>

<!-- 背景场景 -->
<div class="scene">
  <div class="sun"></div>
  <div class="wave w3"><svg viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="#0d4c7d" d="M0,120 C240,60 360,180 720,120 C1080,60 1200,180 1440,120 L1440,200 L0,200 Z"/></svg></div>
  <div class="wave w2"><svg viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="#12629b" d="M0,140 C200,90 340,190 720,140 C1100,90 1240,190 1440,140 L1440,200 L0,200 Z"/></svg></div>
  <div class="wave w1"><svg viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="#1a78b8" d="M0,160 C260,110 420,200 720,160 C1020,120 1180,200 1440,160 L1440,200 L0,200 Z"/></svg></div>
</div>

<main class="stage">
  <!-- 左侧招募令 -->
  <section class="brand">
    <!-- 舵轮 -->
    <svg class="wheel" viewBox="0 0 100 100">
      <g stroke="#f2c14e" stroke-width="5" fill="none" stroke-linecap="round">
        <circle cx="50" cy="50" r="40"/>
        <circle cx="50" cy="50" r="14" fill="#0b3f6f"/>
      </g>
      <g stroke="#f2c14e" stroke-width="5" stroke-linecap="round">
        <path d="M50 10 L50 36"/><path d="M50 64 L50 90"/>
        <path d="M10 50 L36 50"/><path d="M64 50 L90 50"/>
        <path d="M22 22 L41 41"/><path d="M59 59 L78 78"/>
        <path d="M78 22 L59 41"/><path d="M41 59 L22 78"/>
      </g>
      <circle cx="50" cy="50" r="5" fill="#f7e9cd"/>
    </svg>
    <h1><small>O N E &nbsp; P I E C E</small>船员招募登记处</h1>
    <div class="wanted">
      登记须知 ——<br>
      ① 悬赏金：<b>面议</b>，按战力结算<br>
      ② 抵达集合地：<b>香波迪群岛 · 1 号码头</b><br>
      ③ 携带物品：梦想 ≥ <b>1 个</b><br>
      ④ 禁止事项：背叛同伴（唯一不可饶恕之罪）
    </div>
    <p class="quote">"世代传承的意志、时代的浪潮、人的梦想 —— 这些都是无法阻挡的。"</p>
  </section>

  <!-- 右侧表单 -->
  <section class="card" id="card">
    <h2>加入船员名册</h2>
    <p class="sub">填写以下信息，即刻启航前往伟大航道</p>

    <form id="form" novalidate>
      <div class="field">
        <input type="text" id="user" placeholder=" " autocomplete="off">
        <label for="user">航海士代号</label>
        <span class="icon">🏴‍☠️</span>
        <div class="err">代号至少 3 个字符</div>
      </div>

      <div class="field">
        <input type="email" id="mail" placeholder=" " autocomplete="off">
        <label for="mail">贝利邮箱</label>
        <span class="icon">📮</span>
        <div class="err">邮箱格式不正确</div>
      </div>

      <div class="field">
        <input type="password" id="pwd" placeholder=" ">
        <label for="pwd">船舱密钥</label>
        <span class="icon" id="eye">👁️</span>
        <div class="err">密钥至少 6 位</div>
      </div>

      <div class="strength"><i></i><i></i><i></i><i></i></div>
      <div class="tip" id="tip">密钥强度：未设置</div>

      <div class="field">
        <input type="password" id="pwd2" placeholder=" ">
        <label for="pwd2">再次确认密钥</label>
        <span class="icon">🔒</span>
        <div class="err">两次输入的密钥不一致</div>
      </div>

      <label class="agree">
        <input type="checkbox" id="agree">
        <span>我已阅读并同意《伟大航道航行守则》与《船员保密协议》，愿意为梦想承担一切风浪。</span>
      </label>

      <button class="btn" id="btn" type="submit">
        <span class="txt">
          <svg class="spinner" viewBox="0 0 100 100">
            <g stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round">
              <circle cx="50" cy="50" r="40" opacity=".3"/>
              <path d="M50 10 A40 40 0 0 1 90 50"/>
            </g>
          </svg>
          <svg class="check" viewBox="0 0 32 32"><path d="M6 17 L13 24 L26 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="btnText">登 船 注 册</span>
        </span>
      </button>
    </form>

    <p class="foot">已在名册之中？ <a href="#" onclick="return false">返回登录</a></p>
  </section>
</main>

<!-- 成功弹层 -->
<div class="mask" id="mask">
  <div class="flag">
    <div class="post"></div>
    <h3>🎉 登船成功！</h3>
    <p>欢迎加入，<span class="who" id="who">船长</span>！<br>你的旗帜已升起，伟大航道在前方等你。</p>
    <button onclick="closeMask()">继 续 航 行</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
  const $ = id => document.getElementById(id);
  const form = $('form'), btn = $('btn'), btnText = $('btnText'), card = $('card');
  const user = $('user'), mail = $('mail'), pwd = $('pwd'), pwd2 = $('pwd2'), agree = $('agree');

  /* 装饰：云与海鸥 */
  const scene = document.querySelector('.scene');
  [[120,60,26,120],[300,140,34,90],[520,80,22,150]].forEach(([t,w,h,d])=>{
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.cssText = `top:${t}px;width:${w}px;height:${h}px;animation-duration:${d}s;animation-delay:${-Math.random()*d}s`;
    scene.appendChild(c);
  });
  [[70,11,26],[110,9,34],[150,13,30]].forEach(([t,size,d])=>{
    const g = document.createElement('div');
    g.className='gull'; g.textContent='🕊️';
    g.style.cssText=`top:${t}px;font-size:${size}px;animation-duration:${d}s;animation-delay:${-Math.random()*d}s`;
    scene.appendChild(g);
  });

  /* 密码强度 */
  const bars = document.querySelectorAll('.strength i'), tip = $('tip');
  pwd.addEventListener('input', () => {
    const v = pwd.value;
    let s = 0;
    if (v.length >= 6) s++;
    if (v.length >= 10) s++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
    if (/\d|\W/.test(v)) s++;
    const colors = ['#e2cfa8','#e2683c','#e8a020','#d8c22a','#2e9e5b'];
    const labels = ['未设置','太弱了，风一吹就散','勉强够用','不错，能挡住小喽啰','固若金汤，大将也破不开'];
    bars.forEach((b,i)=>{ b.classList.toggle('on', i < s); b.style.background = i < s ? colors[s] : '#e2cfa8'; });
    tip.textContent = '密钥强度：' + labels[s];
  });

  /* 显示/隐藏密码 */
  $('eye').addEventListener('click', () => {
    const t = pwd.type === 'password';
    pwd.type = t ? 'text' : 'password';
    $('eye').textContent = t ? '🙈' : '👁️';
  });

  /* 错误提示 */
  function setErr(input, bad){
    input.parentElement.classList.toggle('invalid', bad);
  }
  [user, mail, pwd, pwd2].forEach(el => {
    el.addEventListener('input', () => setErr(el, false));
  });

  function validate(){
    let ok = true;
    if (user.value.trim().length < 3){ setErr(user,true); ok=false; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail.value)){ setErr(mail,true); ok=false; }
    if (pwd.value.length < 6){ setErr(pwd,true); ok=false; }
    if (pwd2.value !== pwd.value || !pwd2.value){ setErr(pwd2,true); ok=false; }
    return ok;
  }

  /* 点击涟漪 */
  btn.addEventListener('pointerdown', e => {
    const r = btn.getBoundingClientRect();
    const d = Math.max(r.width, r.height);
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
    btn.appendChild(s);
    setTimeout(()=>s.remove(), 700);
  });

  /* 提交 */
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!validate()){
      card.classList.add('shake');
      setTimeout(()=>card.classList.remove('shake'), 520);
      return;
    }
    if (!agree.checked){
      tip.textContent = '请先勾选并同意《伟大航道航行守则》';
      tip.style.color = '#c0392b';
      card.classList.add('shake');
      setTimeout(()=>card.classList.remove('shake'), 520);
      return;
    }
    // 阶段一：加载
    btn.classList.add('loading');
    btnText.textContent = '正在登记名册…';
    // 阶段二：成功
    setTimeout(() => {
      btn.classList.remove('loading');
      btn.classList.add('success');
      btnText.textContent = '登船成功';
      $('who').textContent = user.value.trim();
      celebrate();
      setTimeout(()=>$('mask').classList.add('show'), 420);
    }, 1600);
  });

  /* 撒花庆祝 */
  function celebrate(){
    const box = $('confetti');
    box.innerHTML = ''; box.classList.add('on');
    const colors = ['#f2c14e','#e2683c','#2e9e5b','#3fa9dd','#c0392b','#f7e9cd'];
    for (let i=0;i<90;i++){
      const p = document.createElement('div');
      const coin = Math.random() < .35;
      p.className = 'p ' + (coin ? 'coin' : 'rect');
      if (!coin) p.style.background = colors[i % colors.length];
      p.style.left = Math.random()*100 + 'vw';
      p.style.animation = `fall ${2 + Math.random()*1.6}s linear ${Math.random()*.6}s forwards`;
      box.appendChild(p);
    }
    setTimeout(()=>{ box.classList.remove('on'); box.innerHTML=''; }, 4200);
  }

  function closeMask(){
    $('mask').classList.remove('show');
    setTimeout(()=>{
      btn.classList.remove('success');
      btnText.textContent = '登 船 注 册';
      form.reset();
      bars.forEach(b=>{ b.classList.remove('on'); b.style.background='#e2cfa8'; });
      tip.textContent = '密钥强度：未设置';
      tip.style.color = '#8a6d4b';
    }, 300);
  }
</script>
</body>
</html>
