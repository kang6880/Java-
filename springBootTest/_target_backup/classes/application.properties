spring.application.name=springBootTest
spring.profiles.active=dev

# ==================== 启动速度优化（本地开发） ====================
# 关闭启动横幅，少一次控制台绘制
spring.main.banner-mode=off
# 关闭 JMX 注册（本地开发用不到），可省 100~300ms
spring.jmx.enabled=false

# ==================== 日志 ====================
logging.level.root=info
logging.level.com.fenglin.springboottest=info
# 日志同时写入 log/xx.log
logging.file.name=log/xx.log
# 控制台格式（精简后启动日志更清爽）
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %m%n
# 文件格式（原先是 "logging.pattern.file=logging.pattern.console=..."，写法是错的）
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %m%n
